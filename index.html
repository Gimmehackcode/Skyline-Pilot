<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Pilot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at top,#fff6df,#e7efeb);font-family:system-ui,sans-serif;color:#244451}main{width:min(100%,480px)}header{margin-bottom:18px}header p,article>p{font-size:10px;font-weight:800;letter-spacing:2px;color:#637f7c}h1{font-size:32px;letter-spacing:-1px;margin:6px 0}section{position:relative;border-radius:22px;overflow:hidden;border:1px solid white;box-shadow:0 20px 60px #24445125}canvas{display:block;width:100%;aspect-ratio:3/4;touch-action:none}.hud{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none;font-size:10px;letter-spacing:2px;font-weight:800}.hud div:last-child{text-align:right}strong{display:block;font-size:32px;letter-spacing:-1px}#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:26px;background:#e6f5ef25}#overlay.hidden{display:none}article{max-width:350px;background:#fffdf4f2;padding:30px 26px;border:1px solid white;border-radius:20px;text-align:center;box-shadow:0 12px 35px #24445115}h2{font-size:32px;letter-spacing:-1px;margin:14px 0}#message{font-size:14px;line-height:1.7;color:#637981}button{width:100%;padding:16px;margin-top:25px;border:0;border-radius:10px;background:#e87043;color:white;font:700 16px system-ui;cursor:pointer}button:hover{background:#d85c31}button:focus-visible{outline:3px solid #244451;outline-offset:3px}small{display:block;font-size:9px;letter-spacing:1.5px;margin-top:18px;color:#69817d}footer{display:flex;justify-content:space-between;gap:12px;margin-top:18px;color:#70847e;font-size:10px}

</style></head><body><main><header><p>A LITTLE ARCADE ESCAPE</p><h1>Skyline Pilot &#9992;</h1></header><section><canvas id="game" width="480" height="640" aria-label="Aircraft game: press Space, Arrow Up or tap to climb"></canvas><div class="hud"><div>SCORE<strong id="score">0</strong></div><div>BEST<strong id="best">0</strong></div></div><div id="overlay"><article><p id="status">READY FOR TAKEOFF?</p><h2 id="title">Find your gap.</h2><div id="message">Fly your aircraft through the gaps between city buildings.</div><button id="start">Start flight &#8599;</button><small>SPACE / UP / TAP TO CLIMB</small></article></div></section><footer>Single-engine. Endless skyline.<span>Space or tap to fly</span></footer></main><script>
"use strict";
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),scoreLabel=document.getElementById('score'),bestLabel=document.getElementById('best');
const W=480,H=640,FLOOR=610;
let best=0;
try{best=Number(localStorage.getItem('skylinePilotBest'))||0;}catch(e){}
bestLabel.textContent=best;
let state='ready',score=0,obstacles=[],timer=0,clock=0,previous=0;
let plane={x:125,y:290,vy:0};
function start(){plane={x:125,y:290,vy:-300};score=0;scoreLabel.textContent=0;obstacles=[];timer=.8;state='playing';overlay.classList.add('hidden');}
function flap(){if(state==='playing')plane.vy=-300;else start();}
function finish(){
 state='over';
 if(score>best){best=score;bestLabel.textContent=best;try{localStorage.setItem('skylinePilotBest',best);}catch(e){}}
 document.getElementById('status').textContent='FLIGHT COMPLETE';
 document.getElementById('title').textContent=score?'Nice flying, pilot.':'One more flight?';
 document.getElementById('message').textContent=`You passed ${score} ${score===1?'building':'buildings'}. Keep tapping to stay in the open sky.`;
 document.getElementById('start').textContent='Fly again';overlay.classList.remove('hidden');
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
document.getElementById('start').addEventListener('click',start);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)flap();}});
document.addEventListener('visibilitychange',()=>{previous=0;});
function update(dt){
 clock+=dt;if(state!=='playing')return;
 plane.vy+=880*dt;plane.y+=plane.vy*dt;timer-=dt;
 if(timer<=0){const gap=Math.max(172,210-score*2),top=100+Math.random()*(FLOOR-gap-200);obstacles.push({x:495,w:76,top,bottom:top+gap,passed:false});timer=1.65;}
 for(const b of obstacles){
  b.x-=Math.min(220,165+score*2)*dt;
  // Forgiving aircraft hitbox, with the building roof edges included.
  if(plane.x+21>b.x-5&&plane.x-21<b.x+b.w+5&&(plane.y-10<b.top||plane.y+10>b.bottom)){finish();return;}
  if(!b.passed&&b.x+b.w+5<plane.x-21){b.passed=true;score++;scoreLabel.textContent=score;}
 }
 obstacles=obstacles.filter(b=>b.x+b.w>-10);
 if(plane.y-12<0||plane.y+12>FLOOR)finish();
}
function cloud(x,y,s){ctx.fillStyle='#ffffff80';ctx.beginPath();ctx.ellipse(x,y,s,s*.27,0,0,Math.PI*2);ctx.ellipse(x-s*.2,y-s*.15,s*.48,s*.32,0,0,Math.PI*2);ctx.fill();}
function building(x,y,w,h,upper){
 ctx.fillStyle=upper?'#486a77':'#365563';ctx.fillRect(x,y,w,h);ctx.fillStyle='#ffffff12';ctx.fillRect(x,y,9,h);
 for(let row=y+15;row+10<y+h-8;row+=25)for(let col=x+16;col+8<x+w-8;col+=20){ctx.fillStyle=(Math.floor(row/25)+Math.floor((col-x)/20))%3?'#bdd3c5':'#f4ce83';ctx.fillRect(col,row,8,10);}
 ctx.fillStyle='#263e4c';ctx.fillRect(x-5,upper?y+h-9:y,w+10,9);
}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();}
function drawPlane(){
 ctx.save();ctx.translate(plane.x,state==='ready'?plane.y+Math.sin(clock*2.5)*8:plane.y);ctx.rotate(state==='playing'?Math.max(-.35,Math.min(.9,plane.vy/600)):-.08);
 polygon([[-8,-3],[-17,-27],[-6,-27],[11,-3]],'#e96d40');polygon([[-24,-2],[-31,-17],[-23,-17],[-12,-2]],'#e96d40');
 ctx.fillStyle='#fff4d9';ctx.beginPath();ctx.ellipse(0,0,29,9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#365b6c';ctx.beginPath();ctx.ellipse(9,-5,9,5,0,Math.PI,Math.PI*2);ctx.fill();
 polygon([[-7,1],[-17,25],[-5,25],[12,1]],'#f18148');
 ctx.fillStyle='#365563';ctx.fillRect(28,-14,3,28);ctx.fillStyle='#e87043';ctx.fillRect(23,-3,10,6);ctx.restore();
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9d4db');sky.addColorStop(1,'#f7e8c9');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff0bd';ctx.beginPath();ctx.arc(370,130,43,0,Math.PI*2);ctx.fill();
 for(let i=0;i<5;i++)cloud(((i*137-clock*10)%700+700)%700-100,115+(i%3)*78,45+i*4);
 for(let i=0;i<14;i++){const x=i*45-(clock*7)%45,h=55+(i*73)%115;ctx.fillStyle='#8dada84a';ctx.fillRect(x,FLOOR-h,36,h);ctx.fillStyle='#ffffff25';for(let j=FLOOR-h+12;j<FLOOR;j+=17)ctx.fillRect(x+8,j,19,4);}
 for(const b of obstacles){building(b.x,0,b.w,b.top,true);building(b.x,b.bottom,b.w,FLOOR-b.bottom,false);}
 ctx.fillStyle='#334e55';ctx.fillRect(0,FLOOR,W,30);ctx.fillStyle='#92aba0';ctx.fillRect(0,FLOOR,W,4);ctx.fillStyle='#b3b9a4';for(let i=0;i<12;i++)ctx.fillRect(i*50-(clock*80)%50,FLOOR+17,25,2);
 drawPlane();
}
function frame(time){const dt=previous?Math.min((time-previous)/1000,.033):0;previous=time;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

</script></body></html>
